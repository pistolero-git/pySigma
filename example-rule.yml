title: Suspicious Whoami Privileges
id: 11111111-1111-4111-8111-111111111111
status: experimental
description: Detects whoami.exe querying process privileges.
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\whoami.exe'
    CommandLine|contains: '/priv'
  condition: selection
falsepositives:
  - Administrative activity
level: medium
